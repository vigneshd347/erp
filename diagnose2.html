<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERP Diagnostic v2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="seed_data.js"></script>
    <script src="supabase.js?v=1000"></script>
<style>
  body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h2 { color: #38bdf8; }
  .ok { color: #4ade80; }
  .warn { color: #fbbf24; }
  .err { color: #f87171; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin: 12px 0; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 0.8rem; max-height: 300px; overflow-y: auto; }
  button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; margin: 4px; }
  button:hover { background: #2563eb; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-left: 8px; }
  .badge-ok { background: #166534; color: #4ade80; }
  .badge-warn { background: #854d0e; color: #fbbf24; }
  .badge-err { background: #7f1d1d; color: #f87171; }
</style>
</head>
<body>
<h2>🔍 ERP Diagnostic v2</h2>
<p>Waiting for CloudDataLoaded event…</p>

<div id="status" class="box">
  <div id="status-text">⏳ Loading cloud data…</div>
</div>

<div id="results"></div>

<div class="box">
  <h3>Direct Supabase Test</h3>
  <button onclick="testDirect()">Test Direct Fetch</button>
  <pre id="direct-out">Click button to test...</pre>
</div>

<div class="box">
  <h3>Errors captured</h3>
  <pre id="errors-out">None yet</pre>
</div>

<script>
const errors = [];
window.addEventListener('error', e => {
  errors.push(`ERROR: ${e.message} @ ${e.filename}:${e.lineno}`);
  document.getElementById('errors-out').textContent = errors.join('\n');
});
window.addEventListener('unhandledrejection', e => {
  errors.push(`PROMISE REJECTION: ${e.reason}`);
  document.getElementById('errors-out').textContent = errors.join('\n');
});

function badge(count) {
  if (count === 0) return `<span class="badge badge-err">0 ❌</span>`;
  if (count < 5) return `<span class="badge badge-warn">${count} ⚠️</span>`;
  return `<span class="badge badge-ok">${count} ✅</span>`;
}

function showResults() {
  const keys = [
    'manti_order_records',
    'manti_customer_orders',
    'manti_designs',
    'manti_trees',
    'manti_expenses',
    'manti_jobwork_records',
    'manti_supplier_kyc_records',
    'manti_vendor_kyc_records',
    'manti_bank_accounts',
    'manti_staff_records',
    'manti_saved_invoices',
    'manti_payments_made',
    'manti_stock_history',
  ];

  const container = document.getElementById('results');
  container.innerHTML = '';

  keys.forEach(key => {
    const raw = localStorage.getItem(key);
    let count = 0;
    let preview = 'null';
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        count = Array.isArray(parsed) ? parsed.length : Object.keys(parsed).length;
        preview = JSON.stringify(parsed).substring(0, 500);
      } catch(e) {
        preview = `PARSE ERROR: ${e.message}`;
        count = -1;
      }
    }

    const div = document.createElement('div');
    div.className = 'box';
    div.innerHTML = `<b>${key}</b>${badge(count)}<pre>${preview}</pre>`;
    container.appendChild(div);
  });

  // ERP_MEMORY check
  const memDiv = document.createElement('div');
  memDiv.className = 'box';
  let memHtml = '<h3>ERP_MEMORY Keys</h3>';
  if (window.ERP_MEMORY) {
    window.ERP_MEMORY.forEach((v, k) => {
      let count = 0;
      try {
        const p = JSON.parse(v);
        count = Array.isArray(p) ? p.length : (typeof p === 'object' ? Object.keys(p).length : '?');
      } catch(e) { count = '?'; }
      memHtml += `<div>${k}${badge(count)}</div>`;
    });
  } else {
    memHtml += '<span class="err">ERP_MEMORY not defined!</span>';
  }
  memDiv.innerHTML = memHtml;
  container.appendChild(memDiv);

  document.getElementById('status-text').innerHTML = '<span class="ok">✅ CloudDataLoaded received. Results shown below.</span>';
}

document.addEventListener('CloudDataLoaded', () => {
  console.log('Diagnostic: CloudDataLoaded received');
  showResults();
});

// Fallback: show results after 10 seconds even if event never fires
setTimeout(() => {
  const statusEl = document.getElementById('status-text');
  if (statusEl.textContent.includes('Loading')) {
    statusEl.innerHTML = '<span class="err">❌ CloudDataLoaded event NEVER fired after 10s! Showing whatever is in localStorage:</span>';
    showResults();
  }
}, 10000);

// Also check if it already fired
if (window.isCloudDataLoaded) {
  showResults();
}

async function testDirect() {
  const out = document.getElementById('direct-out');
  out.textContent = 'Fetching...';
  try {
    const SUPABASE_URL = 'https://stcomjtuuuchdafhssgv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0Y29tanR1dXVjaGRhZmhzc2d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3OTg2NDYsImV4cCI6MjA5MDM3NDY0Nn0.scmi8txiJEd334girnUK3EXGLFM6vvqPekRzE2DDaC0';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const results = {};

    const { data: des, error: desErr } = await client.from('designs').select('id,category').range(0,9999);
    results.designs = desErr ? `ERROR: ${desErr.message}` : `${des.length} records (sample: ${JSON.stringify(des.slice(0,3))})`;

    const { data: ord, error: ordErr } = await client.from('orders').select('order_number,type').range(0,9999);
    results.orders = ordErr ? `ERROR: ${ordErr.message}` : `${ord.length} records`;

    const { data: set, error: setErr } = await client.from('settings').select('setting_key').range(0,9999);
    results.settings_keys = setErr ? `ERROR: ${setErr.message}` : set.map(s => s.setting_key).join(', ');

    const { data: exp, error: expErr } = await client.from('expenses').select('id').range(0,9999);
    results.expenses = expErr ? `ERROR: ${expErr.message}` : `${exp.length} records`;

    const { data: pay, error: payErr } = await client.from('payments_made').select('id').range(0,9999);
    results.payments = payErr ? `ERROR: ${payErr.message}` : `${pay.length} records`;

    out.textContent = JSON.stringify(results, null, 2);
  } catch(e) {
    out.textContent = `EXCEPTION: ${e.message}\n${e.stack}`;
  }
}
</script>
</body>
</html>
